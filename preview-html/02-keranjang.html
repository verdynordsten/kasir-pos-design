<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Kasir POS HP — 02 Keranjang</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563EB;--accent:#EA580C;--bg:#F8FAFC;--fg:#1E293B;--card:#fff;--mut:#E9EFF8;--mutfg:#64748B;--line:#E2E8F0;--danger:#DC2626;--ok:#16A34A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Work Sans',system-ui;background:#0F172A;display:flex;justify-content:center;min-height:100vh;padding:24px 12px}
.phone{width:390px;min-height:844px;background:var(--bg);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;color:var(--fg);box-shadow:0 30px 80px #00000088}
h1,h2,h3,b,.num{font-family:'Outfit',sans-serif}
.status{background:#fff;display:flex;justify-content:space-between;padding:12px 22px 4px;font-size:12px;font-weight:700}
.nav{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.back{width:36px;height:36px;border-radius:11px;background:var(--mut);display:grid;place-items:center;font-size:17px;cursor:pointer}
.nav b{font-size:15px}.nav small{color:var(--mutfg);font-size:11px}
.list{flex:1;padding:12px 16px;overflow-y:auto}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;margin-bottom:10px;align-items:center}
.item .e{width:48px;height:48px;border-radius:12px;background:var(--mut);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.item .inf{flex:1}.item .inf b{font-size:13px;display:block}.item .inf small{color:var(--mutfg);font-size:11.5px}
.qty{display:flex;align-items:center;gap:8px}
.qb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--primary);font-weight:800;cursor:pointer}
.amt{font-size:12.5px;font-weight:800;text-align:right}
.disc{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}
.disc input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;outline:0;text-transform:uppercase}
.disc button{background:var(--primary);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:800;cursor:pointer;font-size:13px}
.sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.r{display:flex;justify-content:space-between;font-size:13px;color:var(--mutfg);margin-bottom:5px}
.r.ok span:last-child{color:var(--ok);font-weight:800}
.r.gr{font-size:17px;color:var(--fg);font-weight:700;margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.foot{background:#fff;border-top:1px solid var(--line);padding:12px 16px 22px}
.go{width:100%;padding:15px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Rubik'}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>09.41</span><span>●●● ○ 5G ▮</span></div>
  <div class="nav"><div class="back">←</div><div><b>Keranjang • 3 item</b><small>Toko Berkah Jaya</small></div></div>
  <div class="list">
    <div class="item"><div class="e">☕</div><div class="inf"><b>Kopi Tubruk 200g</b><small class="num">Rp 28.000 /pcs</small><div class="qty" style="margin-top:6px"><button class="qb">−</button><b class="num">1</b><button class="qb">+</button></div></div><div class="amt num">Rp 28.000</div></div>
    <div class="item"><div class="e">🍜</div><div class="inf"><b>Indomie Goreng</b><small class="num">Rp 3.500 /pcs</small><div class="qty" style="margin-top:6px"><button class="qb">−</button><b class="num">2</b><button class="qb">+</button></div></div><div class="amt num">Rp 7.000</div></div>
    <div class="item"><div class="e">💧</div><div class="inf"><b>Aqua 600ml</b><small class="num">Rp 4.000 /pcs</small><div class="qty" style="margin-top:6px"><button class="qb">−</button><b class="num">1</b><button class="qb">+</button></div></div><div class="amt num">Rp 4.000</div></div>
    <div class="disc">🏷️ <input value="HEMAT10" placeholder="Kode promo"><button>Pakai</button></div>
    <div class="sum">
      <div class="r"><span>Subtotal</span><span class="num">Rp 39.000</span></div>
      <div class="r ok"><span>Promo HEMAT10 (−10%)</span><span class="num">−Rp 3.900</span></div>
      <div class="r"><span>Pajak (10%)</span><span class="num">Rp 3.510</span></div>
      <div class="r gr"><span>Total</span><span class="num">Rp 38.610</span></div>
    </div>
  </div>
  <div class="foot"><button class="go">Lanjut ke Pembayaran →</button></div>
</div>
</body>
</html>
