<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Kasir POS HP — 01 Katalog</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563EB;--accent:#EA580C;--bg:#F8FAFC;--fg:#1E293B;--card:#fff;--mut:#E9EFF8;--mutfg:#64748B;--line:#E2E8F0;--ok:#16A34A;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Work Sans',system-ui;background:#0F172A;display:flex;justify-content:center;min-height:100vh;padding:24px 12px}
.phone{width:390px;min-height:844px;background:var(--bg);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;color:var(--fg);box-shadow:0 30px 80px #00000088}
h1,h2,h3,b,.num{font-family:'Outfit',sans-serif}
.status{background:#fff;display:flex;justify-content:space-between;padding:12px 22px 4px;font-size:12px;font-weight:700}
.appbar{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px}
.appbar b{font-size:15px;display:block}.appbar small{color:var(--mutfg);font-size:11px}
.bell{margin-left:auto;width:38px;height:38px;border-radius:12px;background:var(--mut);display:grid;place-items:center;font-size:17px;cursor:pointer}
.searchrow{padding:12px 16px 4px;background:#fff}
.search{display:flex;gap:8px;align-items:center;background:var(--mut);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--mutfg)}
.cats{display:flex;gap:6px;padding:12px 16px;background:#fff;overflow:hidden}
.cat{white-space:nowrap;flex-shrink:0;border:1px solid var(--line);background:#fff;padding:8px 0;width:72px;text-align:center;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--mutfg);font-family:'Work Sans'}
.cat.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cat.more{width:34px;font-size:14px}
.grid{flex:1;padding:6px 16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;overflow-y:auto}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;font-family:'Work Sans';display:flex;flex-direction:column}
.prod .th{height:88px;min-height:88px;max-height:88px;border-radius:10px;background:var(--mut);margin-bottom:8px;overflow:hidden;flex-shrink:0}
.prod .th img{width:100%;height:88px;object-fit:cover;border-radius:10px;display:block}
.prod b{font-size:12.5px;display:block;line-height:1.3;min-height:32px}
.prod .pr{color:var(--primary);font-weight:800;font-size:13.5px;margin-top:3px}
.prod .st{font-size:10.5px;color:var(--mutfg)}
.cartbar{background:#fff;border-top:1px solid var(--line);padding:12px 16px 20px}
.row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mutfg);margin-bottom:2px}
.row.total{font-size:16px;color:var(--fg);font-weight:700;margin:4px 0 10px}
.go{width:100%;padding:15px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Rubik'}
.go:disabled{opacity:.4}
.tabbar{background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px 20px}
.tab{border:0;background:none;font-size:10px;color:var(--mutfg);cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;font-weight:700;font-family:'Work Sans'}
.tab span{font-size:20px}.tab.on{color:var(--primary)}
.badge{position:relative}.badge i{position:absolute;top:-4px;right:8px;background:var(--accent);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:800}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>09.41</span><span>●●● ○ 5G ▮</span></div>
  <div class="appbar"><div class="logo">K</div><div><b>Toko Berkah Jaya</b><small>Andi • Shift Pagi</small></div><div class="bell">🔔</div></div>
  <div class="searchrow"><div class="search">⌕ &nbsp;Cari produk / scan barcode…</div></div>
  <div class="cats"><button class="cat on">Semua</button><button class="cat">Minuman</button><button class="cat">Makanan</button><button class="cat">Snack</button><button class="cat more">+</button></div>
  <div class="grid" id="grid"></div>
  <div class="cartbar">
    <div class="row"><span id="n">0 item</span><span id="sub">Rp 0</span></div>
    <div class="row total"><span>Total</span><span id="grand">Rp 0</span></div>
    <button class="go" id="go" disabled>Lihat Keranjang →</button>
  </div>
  <div class="tabbar">
    <button class="tab on"><span>🏠</span>Beranda</button>
    <button class="tab badge"><span>🧺</span><i id="bi">0</i>Keranjang</button>
    <button class="tab"><span>🧾</span>Riwayat</button>
    <button class="tab"><span>⚙️</span>Lainnya</button>
  </div>
</div>
<script>
const P=[{n:"Kapal Api 200g",p:28000,e:"\u2615",s:42,c:"Minuman"},{n:"Teh Pucuk 350ml",p:6000,e:"\U0001F9CB",s:120,c:"Minuman"},{n:"Indomie Goreng",p:3500,e:"\U0001F35C",s:200,c:"Makanan"},{n:"Sari Roti Tawar",p:18000,e:"\U0001F35E",s:35,c:"Makanan"},{n:"Ultra Milk 250ml",p:7000,e:"\U0001F95B",s:60,c:"Minuman"},{n:"Chitato Keju 68g",p:12000,e:"\U0001F35F",s:88,c:"Snack"},{n:"Aqua 600ml",p:4000,e:"\U0001F4A7",s:300,c:"Minuman"},{n:"Bimoli 2L",p:42000,e:"\U0001FAB7",s:40,c:"Sembako"},{n:"Beras Sun 5kg",p:68500,e:"\U0001F33E",s:25,c:"Sembako"},{n:"Lifebuoy 85g",p:9500,e:"\U0001F9FC",s:90,c:"Lainnya"}];
const fmt=n=>"Rp "+n.toLocaleString("id-ID");
const grid=document.getElementById('grid');
grid.innerHTML=P.map((p,i)=>{const IM={'Indomie Goreng':'indomie.jpg','Chitato Keju 68g':'chitato.jpg','Teh Pucuk 350ml':'tehpucuk.jpg','Aqua 600ml':'aqua.jpg','Sari Roti Tawar':'roti.jpg','Beras Sun 5kg':'beras.jpg','Kapal Api 200g':'kopi.jpg','Ultra Milk 250ml':'susu.jpg','Bimoli 2L':'minyak.jpg','Lifebuoy 85g':'sabun.jpg'};const th=IM[p.n]?`<img src='${IM[p.n]}' loading='lazy'>`:p.e;return `<button class="prod" data-i="${i}"><div class="th">${th}</div><b>${p.n}</b><div class="pr num">${fmt(p.p)}</div><div class="st">Stok ${p.s}</div></button>`}).join('');
let n=2,g=33500;
document.getElementById('n').textContent=n+" item";document.getElementById('sub').textContent=fmt(g);document.getElementById('grand').textContent=fmt(g);document.getElementById('bi').textContent=n;document.getElementById('go').disabled=false;
grid.querySelectorAll('.prod').forEach(b=>b.onclick=()=>{n++;const p=P[+b.dataset.i];g+=p.p;document.getElementById('n').textContent=n+" item";document.getElementById('sub').textContent=fmt(g);document.getElementById('grand').textContent=fmt(g);document.getElementById('bi').textContent=n;});
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
</script>
</body>
</html>
